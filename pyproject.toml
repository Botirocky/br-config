[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "br-config"
dynamic = ["version"]
description = "Windows és Linux konfigurációs központ: gépfelismerés, driverek, programtelepítés, tuning."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Botirocky" }]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.10"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
]

[project.urls]
Homepage = "https://botirocky.github.io/br-config/"
Source = "https://github.com/Botirocky/br-config"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyinstaller>=6.11", "pillow>=10"]

[project.scripts]
br-config-cli = "br_config.cli:main"

[project.gui-scripts]
br-config = "br_config.__main__:main"

[tool.hatch.version]
path = "src/br_config/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/br_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["gui: Qt felületet igénylő teszt"]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gui.py" = ["E402"]
